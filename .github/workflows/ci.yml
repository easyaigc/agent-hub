name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mobile_parity_base:
        description: Optional existing comparison commit for a manual parity audit
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'agent-hub-linux' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - uses: pnpm/action-setup@v4
      - name: Check workspace disk budget
        run: |
          node --input-type=module <<'JS'
          import { statfsSync } from 'node:fs';
          const fs = statfsSync('.');
          const free = fs.bavail * fs.bsize;
          console.log(`Workspace available space: ${(free / 2 ** 30).toFixed(2)} GiB`);
          if (free < 4 * 2 ** 30) throw new Error('Workspace checks require at least 4 GiB available');
          JS
      - run: pnpm install --frozen-lockfile --fetch-timeout=300000 --network-concurrency=4
        timeout-minutes: 20
      - name: Verify installed Turbo platform binary
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const packagePath = require.resolve('turbo/package.json');
          const fromTurbo = createRequire(packagePath);
          const platform = process.platform === 'win32' ? 'windows' : process.platform;
          const arch = process.arch === 'x64' ? '64' : process.arch;
          const suffix = process.platform === 'win32' ? '.exe' : '';
          const binary = fromTurbo.resolve(`@turbo/${platform}-${arch}/bin/turbo${suffix}`);
          const expected = require(packagePath).version;
          assert.equal(execFileSync(binary, ['--version'], { encoding: 'utf8' }).trim(), expected);
          console.log(`Verified installed Turbo ${expected} for ${platform}/${arch}`);
          JS
      - name: Select mobile parity comparison history
        run: node scripts/ci/mobile-parity-base.mjs
      - name: Check legacy CI bootstrap boundaries
        run: node --test scripts/ci/legacy-bootstrap.test.mjs
      - name: Check Linux research metadata boundaries
        run: python3 scripts/ci/research-posix-tools.test.py
      - name: Build workspace prerequisites
        run: pnpm build
      - run: pnpm check
      - name: Check feature changes against pull request base
        if: github.event_name == 'pull_request'
        env:
          MOBILE_PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/mobile/parity.mjs

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Check iOS build disk budget
        run: |
          node --input-type=module <<'JS'
          import { statfsSync } from 'node:fs';
          const fs = statfsSync('.');
          const free = fs.bavail * fs.bsize;
          console.log(`iOS build available space: ${(free / 2 ** 30).toFixed(2)} GiB`);
          if (free < 4 * 2 ** 30) throw new Error('iOS build requires at least 4 GiB available');
          JS
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project apps/ios/CodexManage.xcodeproj
          -scheme CodexManage -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Check native Swift regression boundaries
        if: github.server_url == 'https://git.51easyai.com'
        run: |
          node apps/ios/Tests/desktop-suggestions-smoke.mjs all
          node scripts/attachment-download-native-smoke.mjs
          node scripts/upload-wire-cancellation-native-smoke.mjs
          node scripts/mobile/codex-project-git-native-smoke.mjs
          node scripts/mobile/check-ios-sheet-routes.mjs
          node scripts/mobile/easywork-subagent-history-native.mjs
      - name: Regress released child history, recording taps and quota details
        if: github.server_url == 'https://git.51easyai.com'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          IOS_SIMULATOR_ID=$(node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          const inventory = JSON.parse(execFileSync('xcrun', ['simctl', 'list', '-j']));
          const runtime = inventory.runtimes
            .filter((r) => r.isAvailable && r.identifier.includes('.iOS-'))
            .sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }))[0];
          const types = runtime?.supportedDeviceTypes ?? inventory.devicetypes;
          const type = types.find((d) => d.name === 'iPhone 16 Pro Max')
            ?? types.find((d) => d.name.startsWith('iPhone'));
          assert(runtime && type, 'An available iOS Simulator runtime and iPhone type are required');
          process.stdout.write(execFileSync('xcrun', ['simctl', 'create',
            'AgentHub-ReleasedWorkflows-' + randomUUID(), type.identifier, runtime.identifier],
            { encoding: 'utf8' }).trim());
          JS
          )
          export IOS_SIMULATOR_ID
          trap 'xcrun simctl shutdown "$IOS_SIMULATOR_ID" >/dev/null 2>&1 || true; xcrun simctl delete "$IOS_SIMULATOR_ID"' EXIT
          xcrun simctl boot "$IOS_SIMULATOR_ID"
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          node scripts/mobile/ios-baseline.mjs subagents voiceTap usageDetails
      - name: Preserve bounded native failure diagnostics before cleanup
        if: (failure() || cancelled()) && github.server_url == 'https://git.51easyai.com'
        timeout-minutes: 2
        run: node scripts/mobile/ios-baseline-diagnostics.mjs

interface:
  display_name: '接入 Codex 电脑'
  short_description: '安装 Mac/Windows Host／Bridge，按运行时就绪开放正式功能与自启'
  default_prompt: '使用 $codex-host-connect 接入这台电脑的原 Codex 桌面，默认配置全部适用功能、Host 自启、局域网和可选 Tailscale HTTPS、首次 Host Key 授权及已授权设备自动重连；macOS 同时配置 v2 单实例共享通道、Host 持久 URL 和 Trace，保留身份、权限及明确的子集选择，分别交付连接参数、正常重开动作与逐项真实验收，如实列出 Windows 限制。'

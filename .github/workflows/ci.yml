name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - name: Check feature changes against pull request base
        if: github.event_name == 'pull_request'
        env:
          MOBILE_PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/mobile/parity.mjs

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project apps/ios/CodexManage.xcodeproj
          -scheme CodexManage -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
